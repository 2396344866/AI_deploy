<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="820" height="680" fill="#fbfdff"/>

  <text x="410" y="32" font-size="19" font-weight="700" fill="#16324f" text-anchor="middle">STM32 OTA BootLoader 升级流程图</text>
  <text x="410" y="52" font-size="12.5" fill="#5b6b7b" text-anchor="middle">ESP-01S(MQTT AT) + 阿里云 IoT OTA · 双 APP 槽 + active_slot 切换 + IWDG 失效保护</text>

  <!-- Start -->
  <rect x="350" y="66" width="120" height="34" rx="17" fill="#2f6fed"/>
  <text x="410" y="88" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">上电 / 复位</text>

  <!-- BootLoader init (S0) -->
  <rect x="320" y="118" width="180" height="34" rx="8" fill="#16a085"/>
  <text x="410" y="140" font-size="12.5" fill="#fff" text-anchor="middle">BootLoader 初始化 (S0)</text>

  <!-- read OTA flag -->
  <rect x="320" y="170" width="180" height="34" rx="8" fill="#1f8dd6"/>
  <text x="410" y="192" font-size="12.5" fill="#fff" text-anchor="middle">读参数区 OTA_FLAG</text>

  <!-- decision: need update? -->
  <polygon points="410,222 500,250 410,278 320,250" fill="#f1c40f"/>
  <text x="410" y="246" font-size="12" fill="#243" text-anchor="middle" font-weight="700">需升级?</text>
  <text x="512" y="244" font-size="11.5" fill="#7b5e00">FLAG=UPDATE</text>
  <text x="218" y="244" font-size="11.5" fill="#2c7a4b">FLAG=OK / 超时</text>

  <!-- branch A: no update -> boot active -->
  <path d="M320,250 L180,250 L180,330 L280,330" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="316" width="200" height="34" rx="8" fill="#27ae60"/>
  <text x="380" y="338" font-size="12" fill="#fff" text-anchor="middle">跳激活 APP (active_slot)</text>

  <!-- branch B: update -> fetch via ESP-01S -->
  <path d="M500,250 L590,250 L590,330 L490,330" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="490" y="316" width="220" height="34" rx="8" fill="#e67e22"/>
  <text x="600" y="338" font-size="11.5" fill="#fff" text-anchor="middle">ESP-01S 下载新固件</text>
  <text x="600" y="356" font-size="10" fill="#7a3b00" text-anchor="middle">(MQTT 收 URL → HTTP 拉包 → 写 W25Q)</text>

  <!-- download detail -->
  <rect x="490" y="372" width="220" height="30" rx="6" fill="#eb984e" opacity="0.92"/>
  <text x="600" y="391" font-size="11" fill="#fff" text-anchor="middle">CRC32 校验整包</text>

  <polygon points="600,404 660,424 600,444 540,424" fill="#f1c40f"/>
  <text x="600" y="428" font-size="11" fill="#243" text-anchor="middle" font-weight="700">校验通过?</text>

  <!-- fail crc -->
  <path d="M660,424 L730,424 L730,500 L650,500" stroke="#c0392b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="486" width="160" height="30" rx="8" fill="#c0392b"/>
  <text x="660" y="505" font-size="11.5" fill="#fff" text-anchor="middle">丢弃 / 重试(≤3)</text>

  <!-- pass crc -> erase APP2 + write -->
  <path d="M540,424 L450,424 L450,486" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="486" width="220" height="30" rx="8" fill="#8e44ad"/>
  <text x="380" y="505" font-size="11" fill="#fff" text-anchor="middle">擦 备用槽 → 写新固件</text>

  <!-- set flag pending -->
  <rect x="270" y="532" width="240" height="30" rx="8" fill="#8e44ad" opacity="0.8"/>
  <text x="390" y="551" font-size="11" fill="#fff" text-anchor="middle">置 OTA_FLAG=PENDING + 版本号</text>

  <!-- both branches converge to reboot -->
  <path d="M380,516 L380,575 L480,575" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660,516 L660,575 L480,575" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="560" width="160" height="32" rx="16" fill="#2f6fed"/>
  <text x="480" y="581" font-size="12.5" fill="#fff" text-anchor="middle">软件复位重启</text>

  <!-- after reboot: boot pending -->
  <path d="M480,592 L480,612" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="612" width="260" height="30" rx="8" fill="#2980b9"/>
  <text x="480" y="631" font-size="11.5" fill="#fff" text-anchor="middle">启动新 APP → 3分钟心跳 → 成功则 OK</text>

  <!-- heartbeat decision -->
  <text x="640" y="632" font-size="11" fill="#c0392b" text-anchor="middle">失败/无心跳</text>
  <path d="M640,630 L640,560 L680,560" stroke="#c0392b" fill="none" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>
  <text x="688" y="556" font-size="10.5" fill="#c0392b">回滚到旧 APP</text>

  <!-- IWDG 失效保护 标注 -->
  <rect x="40" y="486" width="200" height="56" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.2"/>
  <text x="140" y="506" font-size="11.5" fill="#7b5e00" text-anchor="middle" font-weight="700">IWDG1 失效保护</text>
  <text x="140" y="524" font-size="10" fill="#7b5e00" text-anchor="middle">LSI 32kHz · 超时≈4.1s</text>
  <text x="140" y="538" font-size="10" fill="#7b5e00" text-anchor="middle">TIM7 常态喂 · POST 协作喂</text>
  <path d="M240,514 L270,514" stroke="#f39c12" fill="none" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowY)"/>

  <!-- ESP32-S3 旁路备注 -->
  <rect x="40" y="616" width="220" height="40" rx="8" fill="#eaf2fb" stroke="#3498db" stroke-width="1"/>
  <text x="150" y="634" font-size="10.5" fill="#1f4e79" text-anchor="middle">ESP32-S3 CAM（独立工程）</text>
  <text x="150" y="648" font-size="10" fill="#1f4e79" text-anchor="middle">USART6 只传图像结论，不参与 OTA</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f39c12"/>
    </marker>
  </defs>
</svg>
