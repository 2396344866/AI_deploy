<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="880" height="720" fill="#fbfdff"/>

  <text x="440" y="30" font-size="19" font-weight="700" fill="#16324f" text-anchor="middle">STM32 OTA BootLoader 升级流程图（APP 下载 / BootLoader 仅判定）</text>
  <text x="440" y="50" font-size="12.5" fill="#5b6b7b" text-anchor="middle">ESP-01S(MQTT AT) + 阿里云 IoT OTA · 双 APP 槽 + active_slot 切换 + IWDG 失效保护</text>

  <!-- Start -->
  <rect x="380" y="62" width="120" height="32" rx="16" fill="#2f6fed"/>
  <text x="440" y="83" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">上电 / 复位</text>

  <!-- BootLoader init -->
  <rect x="350" y="110" width="180" height="32" rx="8" fill="#16a085"/>
  <text x="440" y="131" font-size="12.5" fill="#fff" text-anchor="middle">BootLoader 初始化 (S0)</text>

  <!-- read flag -->
  <rect x="330" y="158" width="220" height="32" rx="8" fill="#1f8dd6"/>
  <text x="440" y="179" font-size="12.5" fill="#fff" text-anchor="middle">读参数区 OTA_FLAG / active_slot</text>

  <!-- decision: UPDATE? -->
  <polygon points="440,222 540,254 440,286 340,254" fill="#f1c40f"/>
  <text x="440" y="250" font-size="12" fill="#243" text-anchor="middle" font-weight="700">FLAG=UPDATE?</text>
  <text x="556" y="248" font-size="11" fill="#7b5e00">FLAG=UPDATE</text>
  <text x="222" y="248" font-size="11" fill="#2c7a4b">FLAG=OK / 超时</text>

  <!-- branch OK -> jump active -->
  <path d="M340,254 L240,254 L240,300 L300,300" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="110" y="286" width="210" height="32" rx="8" fill="#27ae60"/>
  <text x="215" y="307" font-size="12" fill="#fff" text-anchor="middle">跳激活 APP (active_slot)</text>

  <!-- branch UPDATE -> jump active (UPDATE handling) -->
  <path d="M540,254 L640,254 L640,300 L580,300" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="286" width="220" height="32" rx="8" fill="#e67e22"/>
  <text x="610" y="307" font-size="11.5" fill="#fff" text-anchor="middle">跳 active APP（UPDATE 分支）</text>

  <!-- APP running -->
  <path d="M320,318 L320,348 L360,348" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600,318 L600,348 L560,348" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="346" width="360" height="32" rx="8" fill="#2980b9"/>
  <text x="470" y="367" font-size="12" fill="#fff" text-anchor="middle">APP 运行中（下载/校验/心跳；BootLoader 不参与网络）</text>

  <!-- APP download + flash -->
  <rect x="290" y="396" width="360" height="32" rx="6" fill="#eb984e"/>
  <text x="470" y="416" font-size="11.5" fill="#fff" text-anchor="middle">ESP-01S 收包 → 内部 Flash 双bank 边下边烧 + CRC32</text>
  <text x="470" y="436" font-size="9.5" fill="#7a3b00" text-anchor="middle">（92KB 全包重下≈7s；重下前必须重擦：Flash 只 1→0）</text>

  <!-- decision CRC -->
  <polygon points="470,452 590,486 470,520 350,486" fill="#f1c40f"/>
  <text x="470" y="482" font-size="11" fill="#243" text-anchor="middle" font-weight="700">CRC 通过?</text>

  <!-- fail CRC -> retry -->
  <path d="M590,486 L680,486 L680,560 L660,560" stroke="#c0392b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="590" y="546" width="170" height="30" rx="8" fill="#c0392b"/>
  <text x="675" y="565" font-size="11" fill="#fff" text-anchor="middle">丢弃 / 重试(≤3)</text>
  <path d="M590,561 L560,561 L560,422 L470,422" stroke="#c0392b" fill="none" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowR)"/>

  <!-- pass CRC -> pending + reset -->
  <path d="M350,486 L300,486 L300,546" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="546" width="240" height="30" rx="8" fill="#8e44ad"/>
  <text x="300" y="565" font-size="11" fill="#fff" text-anchor="middle">置 PENDING + 切 active_slot + 复位</text>

  <!-- software reset -->
  <path d="M300,576 L300,604 L380,604" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M620,576 L620,604 L540,604" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="590" width="160" height="30" rx="15" fill="#2f6fed"/>
  <text x="460" y="609" font-size="12.5" fill="#fff" text-anchor="middle">软件复位重启</text>

  <!-- decision: standby slot CRC self-check (BootLoader) -->
  <path d="M460,620 L460,650 L470,650" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="470,658 590,692 470,726 350,692" fill="#f1c40f"/>
  <text x="470" y="688" font-size="11" fill="#243" text-anchor="middle" font-weight="700">备用槽 CRC 自检?</text>
  <text x="606" y="686" font-size="9.5" fill="#7b5e00">BootLoader 重算，不信 APP</text>

  <!-- fail -> rollback -->
  <path d="M590,692 L680,692 L680,664 L702,664" stroke="#c0392b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="668" font-size="10.5" fill="#c0392b" text-anchor="middle">回滚 active_slot 旧值</text>

  <!-- pass -> jump new APP -->
  <path d="M350,692 L230,692 L230,664 L210,664" stroke="#888" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="668" font-size="10.5" fill="#2c7a4b" text-anchor="middle">跳新 APP</text>

  <!-- 新 APP 心跳标注 -->
  <text x="724" y="700" font-size="10" fill="#2c7a4b" text-anchor="middle">新 APP 3min 心跳</text>
  <text x="724" y="714" font-size="10" fill="#2c7a4b" text-anchor="middle">成功→OK 固化 / 失败→回滚</text>

  <!-- IWDG 标注 -->
  <rect x="30" y="560" width="200" height="56" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.2"/>
  <text x="130" y="580" font-size="11.5" fill="#7b5e00" text-anchor="middle" font-weight="700">IWDG1 失效保护</text>
  <text x="130" y="598" font-size="10" fill="#7b5e00" text-anchor="middle">LSI 32kHz · 超时≈4.1s</text>
  <text x="130" y="612" font-size="10" fill="#7b5e00" text-anchor="middle">APP 心跳喂 / BootLoader 裸轮询喂</text>

  <!-- ESP32-S3 旁路 -->
  <rect x="30" y="640" width="220" height="40" rx="8" fill="#eaf2fb" stroke="#3498db" stroke-width="1"/>
  <text x="140" y="658" font-size="10.5" fill="#1f4e79" text-anchor="middle">ESP32-S3 CAM（独立工程）</text>
  <text x="140" y="672" font-size="10" fill="#1f4e79" text-anchor="middle">USART6 只传图像结论，不参与 OTA</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
