<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" font-family="Consolas, Menlo, monospace">
  <rect width="760" height="760" fill="#ffffff"/>
  <text x="380" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">STM32H743VIT6 Flash 分区 + 内存分布（OTA 双 APP）</text>
  <text x="380" y="48" font-size="12" fill="#666" text-anchor="middle">内部 Flash 2MB / 128KB 扇区×16（Bank1 S0-S7 @0x0800_0000，Bank2 S0-S7 @0x0808_0000）</text>

  <!-- 内部 Flash 总框 -->
  <rect x="40" y="70" width="420" height="600" fill="#f4f7fb" stroke="#9bb3d6" stroke-width="1.5"/>
  <text x="250" y="88" font-size="13" font-weight="bold" fill="#234" text-anchor="middle">内部 Flash (0x0800_0000 - 0x081F_FFFF, 2MB)</text>

  <!-- S0 BootLoader -->
  <rect x="60" y="100" width="380" height="58" fill="#3b6ea5" stroke="#234" stroke-width="1"/>
  <text x="250" y="120" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">S0  BootLoader（独立工程）</text>
  <text x="250" y="137" font-size="11" fill="#eaf" text-anchor="middle">0x0800_0000 · 128KB · 校验/搬运/引导/回滚</text>
  <text x="250" y="152" font-size="10" fill="#dff" text-anchor="middle">读 OTA_PARAM.active_slot 决定启动 APP1/APP2；失败由 IWDG1 兜底</text>

  <!-- S1 参数区 -->
  <rect x="60" y="162" width="380" height="46" fill="#7a9bc4" stroke="#234" stroke-width="1"/>
  <text x="250" y="182" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">S1  参数区 OTA_PARAM</text>
  <text x="250" y="199" font-size="11" fill="#eaf" text-anchor="middle">0x0802_0000 · 128KB · magic/active_slot/flag/version/crc</text>

  <!-- APP1 槽 -->
  <rect x="60" y="212" width="380" height="120" fill="#5a9e6f" stroke="#234" stroke-width="1"/>
  <text x="250" y="232" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">S2-S8  APP1 槽（896KB） 0x0804_0000</text>
  <text x="76" y="252" font-size="11" fill="#eaffea">├ .text    代码（FreeRTOS/驱动/推理逻辑）</text>
  <text x="76" y="269" font-size="11" fill="#eaffea">├ .rodata  只读常量 ⮕ 含两类模型权重：</text>
  <text x="92" y="285" font-size="10.5" fill="#d6ffd6">• Fault_Diagnosis model_weights.h (INT8)</text>
  <text x="92" y="300" font-size="10.5" fill="#d6ffd6">• EdgeImpulse 球磨机检测权重 (ei_* const)</text>
  <text x="76" y="317" font-size="11" fill="#eaffea">└ .data映像 已初始化变量（上电__main搬RAM）</text>

  <!-- APP2 槽 -->
  <rect x="60" y="336" width="380" height="120" fill="#c8923a" stroke="#234" stroke-width="1"/>
  <text x="250" y="356" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">S9-S15 APP2 槽（896KB） 0x080C_0000</text>
  <text x="76" y="376" font-size="11" fill="#fff4e0">├ 升级备用槽 / 下载目标（平时不跑）</text>
  <text x="76" y="393" font-size="11" fill="#fff4e0">├ 结构与 APP1 完全相同（同 .sct，仅 ROM_START 不同）</text>
  <text x="76" y="410" font-size="11" fill="#fff4e0">└ 新固件 CRC32 通过后才切 active_slot 到此</text>
  <text x="76" y="427" font-size="10.5" fill="#ffe0b0">两槽交替：本次备用槽 = 下次可回滚旧固件</text>

  <!-- 说明条 -->
  <rect x="60" y="462" width="380" height="78" fill="#eef2f7" stroke="#9bb3d6" stroke-width="1"/>
  <text x="70" y="478" font-size="10.5" fill="#234">说明：</text>
  <text x="70" y="493" font-size="10.5" fill="#234">• 编译期权重随 APP 整包升级，自动覆盖，不单独开通道</text>
  <text x="70" y="508" font-size="10.5" fill="#234">• RW/ZI 变量运行期全在 RAM，Flash 仅存 .data 初始映像</text>
  <text x="70" y="523" font-size="10.5" fill="#234">• 升级流程：ESP-01S 收包→W25Q64 缓冲→BootLoader 校验</text>
  <text x="70" y="538" font-size="10.5" fill="#234">  CRC32 通过才切 active_slot；失败/卡死由 IWDG1(4.1s) 硬复位回滚</text>

  <!-- RAM 框 -->
  <rect x="470" y="70" width="250" height="380" fill="#fdf3f0" stroke="#d69b9b" stroke-width="1.5"/>
  <text x="595" y="88" font-size="13" font-weight="bold" fill="#7a2e2e" text-anchor="middle">RAM（运行期）</text>
  <text x="595" y="106" font-size="11" fill="#7a2e2e" text-anchor="middle">D-TCM + AXI SRAM 等</text>

  <rect x="488" y="116" width="214" height="40" fill="#c0504d" stroke="#7a2e2e"/>
  <text x="595" y="134" font-size="11" fill="#fff" text-anchor="middle">.data（RW 已初始化变量）</text>
  <text x="595" y="150" font-size="10" fill="#ffe" text-anchor="middle">上电由 __main 从 Flash 拷入</text>

  <rect x="488" y="162" width="214" height="40" fill="#e08a86" stroke="#7a2e2e"/>
  <text x="595" y="180" font-size="11" fill="#fff" text-anchor="middle">.bss / ZI（零初始化变量）</text>
  <text x="595" y="196" font-size="10" fill="#ffe" text-anchor="middle">__main 清零，无 Flash 映像</text>

  <rect x="488" y="208" width="214" height="40" fill="#f0b4b0" stroke="#7a2e2e"/>
  <text x="595" y="226" font-size="11" fill="#7a2e2e" text-anchor="middle">.tensor_arena（EdgeImpulse）</text>
  <text x="595" y="242" font-size="10" fill="#7a2e2e" text-anchor="middle">球磨机检测推理工作区，section 显式放 RAM</text>

  <rect x="488" y="254" width="214" height="34" fill="#e8d4d0" stroke="#7a2e2e"/>
  <text x="595" y="275" font-size="10.5" fill="#7a2e2e" text-anchor="middle">FreeRTOS 堆 + 任务栈</text>

  <text x="595" y="312" font-size="10.5" fill="#7a2e2e" text-anchor="middle">← RAM 内容由新 APP 重启后</text>
  <text x="595" y="328" font-size="10.5" fill="#7a2e2e" text-anchor="middle">  自行 __main 重建，OTA 不搬 RAM</text>

  <!-- W25Q64 外部 -->
  <rect x="470" y="470" width="250" height="200" fill="#eef7ee" stroke="#7ab87a" stroke-width="1.5"/>
  <text x="595" y="490" font-size="13" font-weight="bold" fill="#2e6b2e" text-anchor="middle">外部 W25Q64（SPI1, PA4 CS）</text>
  <text x="595" y="508" font-size="11" fill="#2e6b2e" text-anchor="middle">8MB · 运行期参数 · OTA 碰不到</text>

  <rect x="488" y="518" width="214" height="34" fill="#9bcf9b" stroke="#2e6b2e"/>
  <text x="595" y="538" font-size="10.5" fill="#063" text-anchor="middle">磁标定硬铁/软铁矩阵</text>
  <text x="595" y="547" font-size="9.5" fill="#063" text-anchor="middle">（约12 float，上电加载）</text>

  <rect x="488" y="558" width="214" height="34" fill="#9bcf9b" stroke="#2e6b2e"/>
  <text x="595" y="578" font-size="10.5" fill="#063" text-anchor="middle">崩溃黑匣子 w25q_crashlog</text>
  <text x="595" y="587" font-size="9.5" fill="#063" text-anchor="middle">（HardFault 时轮询写入）</text>

  <rect x="488" y="598" width="214" height="40" fill="#bfe3bf" stroke="#2e6b2e"/>
  <text x="595" y="616" font-size="10.5" fill="#063" text-anchor="middle">OTA 下载缓冲（断点续传）</text>
  <text x="595" y="630" font-size="9.5" fill="#063" text-anchor="middle">收包暂存 → CRC32 → 再写内部Flash</text>

  <!-- IWDG 可靠性标注 -->
  <rect x="488" y="646" width="214" height="44" fill="#f6dede" stroke="#b23b3b" stroke-width="1"/>
  <text x="595" y="664" font-size="10.5" fill="#7a1f1f" text-anchor="middle" font-weight="bold">IWDG1 失效保护（LSI 32k）</text>
  <text x="595" y="679" font-size="9.5" fill="#7a1f1f" text-anchor="middle">超时 4.1s 硬复位；升级/落盘卡死均兜底回滚</text>
  <text x="595" y="691" font-size="9" fill="#7a1f1f" text-anchor="middle">常态喂狗在 LoggerTask（每2ms）</text>

  <text x="595" y="654" font-size="10.5" fill="#2e6b2e" text-anchor="middle">✓ 与内部 Flash 代码区解耦</text>
  <text x="595" y="670" font-size="10.5" fill="#2e6b2e" text-anchor="middle">  OTA 升级 APP 不影响这些参数</text>

  <!-- 箭头：APP槽 <-> RAM -->
  <line x1="440" y1="272" x2="488" y2="136" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="465" y="190" font-size="9" fill="#888" transform="rotate(-78 465 190)">.data 初始映像→</text>

  <text x="380" y="748" font-size="10" fill="#999" text-anchor="middle">图：内部 Flash 双 APP 槽（含编译期模型权重）+ RAM 运行期 + 外部 W25Q64 运行期参数 + IWDG1 失效保护，四者职责分离</text>
</svg>
